name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --ignore-pattern dist --ignore-pattern .next

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (logika bisnis)
        run: node --experimental-strip-types --test tests/business.test.mjs
